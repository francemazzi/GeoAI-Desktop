name: Attest release assets

on:
  push:
    branches:
      - master
  workflow_run:
    workflows:
      - '🍎 Build - MacOS Qt6'
      - '🪟 Windows Qt6'
      - '🐧 Build AppImage (Linux)'
    types:
      - completed

permissions:
  contents: write
  id-token: write

jobs:
  attest-release-assets:
    name: Attest release assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Resolve release tag
        id: resolve-tag
        shell: bash
        run: |
          set -euo pipefail

          TAG=""
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
            if [[ "${HEAD_BRANCH}" == strata-v* ]]; then
              TAG="${HEAD_BRANCH}"
            fi
          fi
          if [ -z "${TAG}" ]; then
            TAG=$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 1 --json tagName,isDraft --jq '.[] | select(.isDraft == false) | .tagName' | head -1)
          fi
          if [ -z "${TAG}" ]; then
            echo "No published release found."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Attesting release ${TAG}"

      - name: Install cosign
        if: steps.resolve-tag.outputs.skip != 'true'
        uses: sigstore/cosign-installer@v3.9.2

      - name: Download release assets
        if: steps.resolve-tag.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve-tag.outputs.tag }}"
          mkdir -p release-assets release-signatures
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir release-assets --clobber
          find release-assets -maxdepth 1 -type f -print | sort

      - name: Sign and verify release assets
        if: steps.resolve-tag.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail

          mapfile -t release_assets < <(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')

          pick_first() {
            local pattern="$1"
            find release-assets -maxdepth 1 -type f -printf '%f\n' | sort | grep -E "${pattern}" | grep -Ev '\.(sha256|sigstore\.json)$' | head -1 || true
          }

          needs_signature() {
            local base="$1"
            printf '%s\n' "${release_assets[@]}" | grep -qx "${base}.sigstore.json"
          }

          targets=()
          for pattern in '\.AppImage$' '\.dmg$' '\.exe$' '-win64\.zip$'; do
            base="$(pick_first "${pattern}")"
            if [ -z "${base}" ]; then
              echo "Skipping missing release binary matching ${pattern}"
              continue
            fi
            if needs_signature "${base}"; then
              echo "Already signed: ${base}"
              continue
            fi
            targets+=("release-assets/${base}")
          done

          if [ "${#targets[@]}" -eq 0 ]; then
            echo "All release binaries already have Sigstore bundles."
            exit 0
          fi

          identity="https://github.com/${GITHUB_WORKFLOW_REF}"

          for file in "${targets[@]}"; do
            base="$(basename "${file}")"
            checksum="release-signatures/${base}.sha256"
            bundle="release-signatures/${base}.sigstore.json"

            (cd release-assets && sha256sum "${base}") > "${checksum}"

            cosign sign-blob --yes --bundle "${bundle}" "${file}"

            (cd release-assets && sha256sum -c "../${checksum}")

            cosign verify-blob \
              --bundle "${bundle}" \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${file}"
          done

      - name: Upload signature assets
        if: steps.resolve-tag.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ ! -d release-signatures ] || [ -z "$(ls -A release-signatures 2>/dev/null || true)" ]; then
            echo "No new signature assets to upload."
            exit 0
          fi
          gh release upload "${TAG}" release-signatures/* --repo "${GITHUB_REPOSITORY}" --clobber
